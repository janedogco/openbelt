<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#e0457b" />
    <title>Sketch</title>
    <script>
      try {
        const t = localStorage.getItem("theme")
        if (t) document.documentElement.dataset.theme = t
      } catch {}
    </script>
    <link rel="icon" href="icon.svg" />
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Sketch</h1>
        <div class="right">
          <div id="people"></div>
          <button class="btn sm" id="theme-btn" aria-label="Dark theme">
            <svg
              class="moon"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg
            ><svg
              class="sun"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              />
            </svg></button
          ><button class="btn sm" id="prompt-btn">Prompt</button>
        </div>
      </header>
      <div id="tools">
        <div id="colors"></div>
        <div id="sizes">
          <button data-size="5" aria-label="Thin brush" class="on">
            <i style="width: 6px; height: 6px"></i></button
          ><button data-size="14" aria-label="Thick brush">
            <i style="width: 14px; height: 14px"></i>
          </button>
        </div>
        <div class="grow"></div>
        <button class="btn sm" id="undo">Undo</button>
        <button class="btn sm" id="clear">Clear</button>
      </div>
      <canvas></canvas>
    </main>
    <dialog id="prompt-dlg">
      <pre>
Build a drawing board everyone in the workspace can draw on at once, on a phone too. A few colours, two brush sizes, undo my last stroke, and clear the board. Teach agents to draw on it too.</pre>
      <div class="row">
        <button class="btn close">Close</button><button class="btn primary copy">Copy</button>
      </div>
    </dialog>
    <script type="module" src="theme.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
