<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#1f9d6b" />
    <title>Pulse</title>
    <script>
      try {
        const t = localStorage.getItem("theme")
        if (t) document.documentElement.dataset.theme = t
      } catch {}
    </script>
    <link rel="icon" href="icon.svg" />
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Pulse</h1>
        <button class="btn sm" id="theme-btn" aria-label="Dark theme">
          <svg
            class="moon"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg
          ><svg
            class="sun"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            />
          </svg></button
        ><button class="btn sm" id="prompt-btn">Prompt</button>
      </header>
      <p id="about"></p>
      <div id="stats"></div>
      <h2>Recent</h2>
      <ul id="feed"></ul>
    </main>
    <dialog id="prompt-dlg">
      <pre>
Build a dashboard over my other apps: how many tasks are open, today's journal entries, who is drawing on the sketch and what's new on the message board, and one feed of the latest activity across all of them. Keep it live.</pre>
      <div class="row">
        <button class="btn close">Close</button><button class="btn primary copy">Copy</button>
      </div>
    </dialog>
    <script type="module" src="theme.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
