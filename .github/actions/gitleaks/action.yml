name: gitleaks
description: Gitleaks 8.30.1, verified against its release digest
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        curl -fsSL --retry 3 --max-time 120 -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
        echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
        sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
